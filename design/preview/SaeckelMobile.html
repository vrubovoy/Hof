<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Säckel — мешки, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">
  <div class="m-band">
    <img class="scene" src="../generated/scene-treasury-band.webp" srcset="../generated/scene-treasury-band.webp 1x, ../generated/scene-treasury-band@2x.webp 2x" alt="Казначейская" style="object-position: 55% 72%">
    <a class="sk-gate" href="HomeMobile.html" data-fx="flip-back" style="left: 12px; top: 12px; height: 40px">Двор</a>
  </div>
  <div class="stack" style="align-items: center; padding-top: 8px"><h1 class="ribbon md"><span>Säckel</span></h1></div>
  <nav style="display: flex; justify-content: center; gap: 6px; padding: 0 16px; background: url(../pen/pen-rule-light.svg) left bottom / 100% 6px no-repeat" aria-label="Säckel"><a class="tab" href="SaeckelMobile.html" aria-current="page">Мешки</a><a class="tab" href="HistoryMobile.html" data-fx="flip-fwd">Летопись</a></nav>
  <div>
  <div class="framed treasury" data-sound="chest" style="margin: 8px 10px 4px; padding: 18px 18px 14px; grid-template-columns: 54px minmax(0, 1fr)">
    <span class="frames chest" style="width: 54px; height: 46px"><img src="../generated/emblem-chest-closed.webp" alt=""><img src="../generated/emblem-chest.webp" alt=""></span>
    <h2 class="title t-3">Казна</h2>
    <span class="money" style="font-size: 28px; line-height: 1.1">18 320 ₽</span>
    <div class="btns" style="display: grid; grid-template-columns: minmax(0, 1fr) auto"><a class="btn btn-ochre" href="AssignMobile.html" data-fx="flip-fwd">Разложить</a><a class="btn" href="IncomeMobile.html" data-fx="flip-fwd">+ Доход</a></div>
  </div>
  <a class="pouch" href="PouchMobile.html" style="margin: 0 6px; padding: 6px 10px 8px" data-fx="flip-fwd"><img src="../generated/icon-basket.webp" alt=""><span class="stack"><span class="name">Продукты</span><span class="sub">последняя трата −1 240 ₽</span></span><span class="bal">12 450,30 ₽</span></a><a class="pouch" href="PouchMobile.html" style="margin: 0 6px; padding: 6px 10px 8px" data-fx="flip-fwd"><img src="../generated/icon-hearth.webp" alt=""><span class="stack"><span class="name">Квартира</span><span class="sub">последняя трата −18 000 ₽</span></span><span class="bal">25 000,00 ₽</span></a><a class="pouch" href="PouchMobile.html" style="margin: 0 6px; padding: 6px 10px 8px" data-fx="flip-fwd"><img src="../generated/icon-cart.webp" alt=""><span class="stack"><span class="name">Транспорт</span><span class="sub neg">в долгу</span></span><span class="bal neg">−760,00 ₽</span></a><a class="pouch" href="PouchMobile.html" style="margin: 0 6px; padding: 6px 10px 8px" data-fx="flip-fwd"><img src="../generated/icon-bag.webp" alt=""><span class="stack"><span class="name">Отпуск</span><span class="sub">трат пока не было</span></span><span class="bal">4 000,00 ₽</span></a>
  <div style="display: flex; justify-content: space-between; padding: 12px 16px"><a class="link-plain" href="SaeckelEmptyMobile.html">+ Новый мешок</a><a class="link-plain small" href="#" style="color: var(--ink-2)">Кладовая (2)</a></div>
  </div>
  <img class="blot" src="../generated/ink-blot-small.webp" alt="" aria-hidden="true" style="left: 340px; top: 800px; width: 32px; opacity: 0.7; transform: rotate(0deg)">
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
