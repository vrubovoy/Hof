<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Hof — вход, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">
  <div class="zoom" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 390px">
    <img src="../generated/login-mobile-v2@2x.webp" alt="Открытые ворота замка, кот смотрит во двор" style="display: block; width: 390px; height: 390px">
    <i class="spot" id="m-gate" style="left: 205px; top: 288px"></i><button type="button" class="cat" aria-label="Кот" style="left: 230px; top: 311px; width: 47px; height: 47px"><img class="pose" src="../generated/pose-login-m.webp" alt="" style="left: -32.00%; top: -26.00%; width: 164.67%; height: 158.67%"></button>
  </div>
  <form class="stack" style="position: relative; gap: 18px; padding: 34px 28px 0">
    <div class="stack" style="align-items: center; gap: 4px"><img src="../logo/hof-mark.svg" width="72" height="72" alt=""><span style="font-weight: 600; font-size: 52px; line-height: 1; letter-spacing: 0.06em">Hof</span><span class="caps" style="font-size: 11px; letter-spacing: 0.24em">Ваш личный двор</span></div>
    <div class="field"><label for="m-login">Логин</label><input id="m-login" class="input" type="text" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label for="m-pass">Пароль</label><input id="m-pass" class="input" type="password" autocomplete="current-password"></div>
    <button type="button" class="btn btn-blue btn-wide" data-go="HomeMobile.html" data-spot="#m-gate">Войти во двор</button>
    <p class="small muted" style="text-align: center">Нет ключа или забыли пароль?<br>Обратитесь к хозяину двора.</p>
  </form>
  <img class="blot" src="../generated/ink-blot-small.webp" alt="" aria-hidden="true" style="left: 330px; top: 26px; width: 34px; opacity: 0.7; transform: rotate(0deg)">
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
