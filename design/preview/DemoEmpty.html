<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">

<div class="hof demo" style="width: 1440px; height: 560px; padding: 44px 60px; display: grid; justify-items: center; align-content: start">
  <div class="stack" style="gap: 12px; align-items: center"><span class="caps">Мешков пока нет — нажатие на кота: нюхает мешки (3 с, звук нюханья)</span><span class="vstack loop-sniff" style="width: 520px"><img src="../generated/empty-saeckel.webp" alt="Кот обнюхивает пустые мешочки"><img class="f1" src="../generated/empty-saeckel-sniff-1.webp" alt=""><img class="f2" src="../generated/empty-saeckel-sniff-2.webp" alt=""></span></div>
</div>
<script>/* прототип: экран нарисован под 1440×560 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 1440, innerHeight / 560); }; fit(); addEventListener('resize', fit); })();</script>
