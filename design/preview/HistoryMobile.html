<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">

  <div class="stack" style="align-items: center; padding-top: 8px"><h1 class="ribbon md"><span>Säckel</span></h1></div>

    <div class="m-list">

    <a class="btn btn-wide" href="#" data-sound="page">Показать ещё</a>
  </div>
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
