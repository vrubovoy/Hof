<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Säckel — разложить, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">
  <div class="m-band">
    <img class="scene" src="../generated/scene-treasury-band.webp" srcset="../generated/scene-treasury-band.webp 1x, ../generated/scene-treasury-band@2x.webp 2x" alt="Казначейская" style="object-position: 55% 72%">
    <a class="sk-gate" href="SaeckelMobile.html" data-fx="flip-back" style="left: 12px; top: 12px; height: 40px">Мешки</a>
  </div>
  <div class="stack" style="gap: 10px; padding: 14px 16px 16px">
    <p class="note" style="margin-left: 22px">Доход 80 000 ₽ лёг в казну.</p>
    <h1 class="title t-2">Разложить по мешкам</h1>
    <p class="small muted">В казне: <span class="money" style="color: var(--ink)">18 320 ₽</span>. Пустые поля пропускаются.</p>
    <div class="m-list">
      <div class="m-assign"><img src="../generated/icon-basket.webp" alt=""><span class="stack"><b>Продукты</b><span class="small money">12 450,30 ₽</span></span><input class="input slim" type="text" inputmode="decimal" value="8 000" aria-label="Положить в мешок Продукты"></div><div class="m-assign"><img src="../generated/icon-hearth.webp" alt=""><span class="stack"><b>Квартира</b><span class="small money">25 000,00 ₽</span></span><input class="input slim" type="text" inputmode="decimal" aria-label="Положить в мешок Квартира"></div><div class="m-assign"><img src="../generated/icon-cart.webp" alt=""><span class="stack"><b>Транспорт</b><span class="small money neg">−760,00 ₽</span></span><input class="input slim" type="text" inputmode="decimal" value="2 000" aria-label="Положить в мешок Транспорт"></div><div class="m-assign"><img src="../generated/icon-bag.webp" alt=""><span class="stack"><b>Отпуск</b><span class="small money">4 000,00 ₽</span></span><input class="input slim" type="text" inputmode="decimal" aria-label="Положить в мешок Отпуск"></div>
    </div>
    <button type="button" class="btn btn-ochre btn-wide" data-sound="coins">Разложить</button>
    <a class="link" href="SaeckelMobile.html" style="align-self: center">Позже — вернуться к мешкам</a>
  </div>
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
