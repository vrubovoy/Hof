<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Säckel — мешок, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 1180px">
  <div class="m-band">
    <img class="scene" src="../generated/scene-treasury-band.webp" srcset="../generated/scene-treasury-band.webp 1x, ../generated/scene-treasury-band@2x.webp 2x" alt="Казначейская" style="object-position: 55% 72%">
    <a class="sk-gate" href="SaeckelMobile.html" data-fx="flip-back" style="left: 12px; top: 12px; height: 40px">Мешки</a>
  </div>
  <div class="stack" style="gap: 12px; padding: 14px 16px 16px">
    <form class="framed stack" style="gap: 10px; padding: 20px 18px 18px">
      <h1 class="title t-2">Мешок «Транспорт»</h1>
      <div class="field"><label for="pe-name">Название</label><input id="pe-name" class="input" type="text" value="Транспорт"></div>
      <fieldset class="field" style="border: 0; padding: 0; margin: 0"><legend style="padding: 0 0 6px">Знак мешка</legend><div class="icons"><label class="icon-pick"><input type="radio" name="pe-icon" value="pouch"><img src="../generated/emblem-saeckel-small.webp" alt="">мешок</label><label class="icon-pick"><input type="radio" name="pe-icon" value="cart" checked><img src="../generated/icon-cart.webp" alt="">повозка</label><label class="icon-pick"><input type="radio" name="pe-icon" value="basket"><img src="../generated/icon-basket.webp" alt="">корзина</label><label class="icon-pick"><input type="radio" name="pe-icon" value="hearth"><img src="../generated/icon-hearth.webp" alt="">очаг</label><label class="icon-pick"><input type="radio" name="pe-icon" value="jug"><img src="../generated/icon-jug.webp" alt="">кувшин</label><label class="icon-pick"><input type="radio" name="pe-icon" value="mortar"><img src="../generated/icon-mortar.webp" alt="">ступка</label><label class="icon-pick"><input type="radio" name="pe-icon" value="needle"><img src="../generated/icon-needle.webp" alt="">игла</label><label class="icon-pick"><input type="radio" name="pe-icon" value="lute"><img src="../generated/icon-lute.webp" alt="">лютня</label><label class="icon-pick"><input type="radio" name="pe-icon" value="bundle"><img src="../generated/icon-bundle.webp" alt="">свёрток</label><label class="icon-pick"><input type="radio" name="pe-icon" value="scroll"><img src="../generated/icon-scroll.webp" alt="">свиток</label><label class="icon-pick"><input type="radio" name="pe-icon" value="pot"><img src="../generated/icon-pot.webp" alt="">кубышка</label><label class="icon-pick"><input type="radio" name="pe-icon" value="toyhorse"><img src="../generated/icon-toyhorse.webp" alt="">лошадка</label><label class="icon-pick"><input type="radio" name="pe-icon" value="bowl"><img src="../generated/icon-bowl.webp" alt="">миска</label><label class="icon-pick"><input type="radio" name="pe-icon" value="hammer"><img src="../generated/icon-hammer.webp" alt="">молоток</label><label class="icon-pick"><input type="radio" name="pe-icon" value="books"><img src="../generated/icon-books.webp" alt="">книги</label><label class="icon-pick"><input type="radio" name="pe-icon" value="bag"><img src="../generated/icon-bag.webp" alt="">котомка</label><label class="icon-pick"><input type="radio" name="pe-icon" value="comb"><img src="../generated/icon-comb.webp" alt="">гребень</label></div></fieldset>
      <button type="button" class="btn btn-ochre btn-wide">Сохранить</button>
    </form>
    <section class="framed stack" style="gap: 10px; padding: 20px 18px 18px">
      <h2 class="title t-3">В кладовую</h2>
      <p class="small muted">Убрать в кладовую можно только пустой мешок. Сейчас в нём <span class="money neg">−760,00 ₽</span>.</p>
      <button type="button" class="btn btn-wide" disabled>В кладовую</button>
      <a class="link" href="#" style="align-self: center">Покрыть из другого мешка</a>
    </section>
  </div>
</div>
<script>/* прототип: экран нарисован под 390×1180 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 1180); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
