<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Hof — тропы нет, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">
  <div class="m-pic fade-b" style="position: relative; height: 390px; overflow: hidden"><img src="../generated/error-404.webp" srcset="../generated/error-404.webp 1x, ../generated/error-404@2x.webp 2x" alt="Заросшая тропинка упирается в глухую стену, увитую плющом" style="position: absolute; left: -40px; top: -20px; width: 640px; max-width: none"></div>
  <main class="stack" style="gap: 10px; padding: 0 24px 20px">
    <a class="logo" href="HomeMobile.html" data-fx="right"><img src="../logo/hof-mark.svg" width="32" height="32" alt=""><span><b style="font-size: 26px">Hof</b><small>Ваш личный двор</small></span></a>
    <h1 class="title t-2">Такой тропы во дворе нет</h1>
    <img class="sprig" src="../generated/sprig-divider.webp" alt="" style="width: 170px">
    <p class="muted">Возможно, ссылка устарела или в адресе опечатка.</p>
    <a class="btn btn-blue btn-wide" href="HomeMobile.html" data-fx="right">Во двор</a>
    <p class="small muted">«Сюда только хозяину» и «Во дворе что-то стряслось» устроены так же — своя картинка сверху.</p>
  </main>
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
