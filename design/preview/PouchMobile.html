<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Säckel — мешок, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">
  <div class="m-band">
    <img class="scene" src="../generated/scene-treasury-band.webp" srcset="../generated/scene-treasury-band.webp 1x, ../generated/scene-treasury-band@2x.webp 2x" alt="Казначейская" style="object-position: 55% 72%">
    <a class="sk-gate" href="SaeckelMobile.html" data-fx="flip-back" style="left: 12px; top: 12px; height: 40px">Мешки</a>
  </div>
  <div class="stack" style="gap: 12px; padding: 14px 16px 16px">
    <div style="display: flex; align-items: center; gap: 10px"><img id="pm-icon" src="../generated/icon-basket.webp" alt="" width="48" height="48" style="object-fit: contain"><h1 class="title t-1">Продукты</h1><a class="link small" href="PouchEditMobile.html" data-fx="flip-fwd" style="margin-left: auto">Изменить</a></div>
    <div class="balance"><span class="caps">Остаток</span><span class="money" style="font-size: 34px; line-height: 1.05">12 450,30 ₽</span></div>
    <form class="framed stack" style="gap: 10px; padding: 22px 20px 18px">
      <div class="field"><label for="pm-sum">Сумма траты, ₽</label><input id="pm-sum" class="input big" type="text" inputmode="decimal"></div>
      <div style="display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px">
        <div class="field"><label for="pm-date">Дата</label><input id="pm-date" class="input" type="text" value="05.10.2026"></div>
        <div class="field"><label for="pm-note">Заметка</label><input id="pm-note" class="input" type="text"></div>
      </div>
      <button type="button" class="btn btn-ochre btn-wide" data-sound="coins" data-fresh="#pm-rows tr:first-child" data-squeeze="#pm-icon">Записать трату</button>
    </form>
    <table class="table"><tbody id="pm-rows">
      <tr><td class="small muted" style="width: 50px">05.10</td><td class="note-text">овощи на рынке</td><td class="num money">−1 240,00 ₽</td></tr>
      <tr><td class="small muted">01.10</td><td>из казны</td><td class="num money">+8 000,00 ₽</td></tr>
    </tbody></table>
  </div>
  <img class="blot" src="../generated/ink-splatter-b.webp" alt="" aria-hidden="true" style="left: 300px; top: 796px; width: 66px; opacity: 0.5; transform: rotate(10deg)">
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
