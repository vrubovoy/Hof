<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Hof — основание, телефон</title>
<script src="../fx-head.js"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="../screens.css">
<style>html, body { height: 100%; margin: 0; overflow: hidden; background: #2E2A24; } body { display: grid; place-items: center; }</style></head>
<body>
<div class="hof" style="width: 390px; height: 844px">
  <form class="stack" style="position: relative; z-index: 1; gap: 10px; padding: 20px 24px 0">
    <div class="logo"><img src="../logo/hof-mark.svg" width="36" height="36" alt=""><span><b style="font-size: 30px">Hof</b><small>Ваш личный двор</small></span></div>
    <div class="stack" style="gap: 2px"><h1 class="title t-2">Основание двора</h1><p class="muted small">Станьте хозяином: вы принимаете приближённых и присматриваете за Hof.</p></div>
    <div class="field"><label for="sm-code">Ключ от ворот</label><input id="sm-code" class="input" type="text" autocomplete="off"><span class="hint">Код из лога сервера</span></div>
    <div class="field"><label for="sm-login">Логин</label><input id="sm-login" class="input" type="text" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label for="sm-pass">Пароль</label><input id="sm-pass" class="input" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="sm-pass2">Пароль ещё раз</label><input id="sm-pass2" class="input" type="password" autocomplete="new-password"></div>
    <button type="button" class="btn btn-blue btn-wide" data-go="HomeMobile.html" data-spot="#sm-gate" data-opens="#sm-gate-open">Основать двор</button>
  </form>
  <div class="zoom fade-t" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 274px; overflow: hidden">
    <img src="../generated/scene-setup.webp" srcset="../generated/scene-setup.webp 1x, ../generated/scene-setup@2x.webp 2x" alt="Ворота замка закрыты, в замке ключ, кот ждёт у ворот" style="position: absolute; left: -85px; top: -160px; width: 760px; max-width: none">
    <img class="gate-open" id="sm-gate-open" src="../generated/setup-gate-open.webp" alt="" style="left: 125px; top: 58px; width: 131px; height: 173px">
    <i class="spot" id="sm-gate" style="left: 190px; top: 137px"></i>
    <button type="button" class="cat" aria-label="Кот" style="left: 199px; top: 206px; width: 49px; height: 61px"><img class="pose" src="../generated/pose-setup.webp" srcset="../generated/pose-setup.webp 1x, ../generated/pose-setup@2x.webp 2x" alt="" style="left: -60.00%; top: -48.39%; width: 225.00%; height: 173.39%"></button>
  </div>
</div>
<script>/* прототип: экран нарисован под 390×844 — вписать его в окно целиком */
(() => { const s = document.querySelector('.hof'); const fit = () => { s.style.zoom = Math.min(innerWidth / 390, innerHeight / 844); }; fit(); addEventListener('resize', fit); })();</script>
<script src="../fx.js" data-base="../"></script>
</body></html>
